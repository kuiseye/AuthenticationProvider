name: auth_app_project
services:
  reverse_proxy:
      image: docker.io/library/nginx:1.31-alpine
      ports:
      - "${SERVER_PORT}:${REVERSE_PROXY_PORT}"
      networks:
        - authentication_network
      env_file:
        - ./.env
      depends_on:
        - authentication_provider
      volumes:
        - ./reverse_proxy:/etc/nginx/templates:ro
        - ./dist:/var/www/frontend:ro
        
#####################################################3
  authentication_provider:
    image: mcr.microsoft.com/dotnet/aspnet:10.0
    working_dir: /app
    command: ["dotnet", "AuthenticationProviderApp.dll"]
    env_file:
      - ./.env
    volumes:
      - ./app:/app:ro
    networks:
      - authentication_network
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
    depends_on:
      - migrate
###############################################
  postgres:
    image: "docker.io/library/postgres:17-alpine"
    expose:
      - ${POSTGRES_PORT}
    volumes:
      - postgres-volume:/var/lib/postgresql/data
    networks:
      - authentication_network
    env_file:
      - ./.env
##################################################3
  migrate:
      image: mcr.microsoft.com/dotnet/runtime-deps:8.0-alpine
      depends_on:
        - postgres
      volumes:
        - ./efbundle:/efbundle:ro
      entrypoint: ["/efbundle", "--connection", "${ConnectionStrings__Default}"]
      restart: "no"
      environment:
        DOTNET_SYSTEM_GLOBALIZATION_INVARIANT: "true"
      networks:
        - "authentication_network"

volumes:
  postgres-volume:
    external: false
networks:
  authentication_network:
    driver: bridge