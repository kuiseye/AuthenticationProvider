services:
  prometheus:
    image: prom/prometheus:v3
    ports:
      - 9090:9090
    volumes:
      - ./docker_compose/prom.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    networks:
      - internal_monitoring_network
      - monitoring
  
  grafana:
    image: grafana/grafana
    ports: 
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
    networks:
      - internal_monitoring_network
  
