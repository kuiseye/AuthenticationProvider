services:
  prometheus:
    image: prom/prometheus:v3
    ports:
      - 9090:9090
    volumes:
      - ../monitoring/prom.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    networks:
      - internal_monitoring_network
      - monitoring_network
#######################################################################################
  grafana:
    image: grafana/grafana
    ports: 
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
    networks:
      - internal_monitoring_network
#######################################################################################
  postgresql-exporter:
        image: prometheuscommunity/postgres-exporter
        container_name: postgresql-exporter
        ports:
            - "9187:9187"
        environment:
            DATA_SOURCE_URI: ${DB_HOST}:${DB_PORT}/${POSTGRES_DB}?sslmode=disable
            DATA_SOURCE_USER: ${POSTGRES_USER}
            DATA_SOURCE_PASS: ${POSTGRES_PASSWORD}

        restart: unless-stopped
        networks:
            - monitoring_network
#######################################################################################

networks:
  internal_monitoring_network:
    external: false
  monitoring_network:
    name: monitoring_network
    external: true

volumes:
  grafana_data:
    external: false
  prometheus_data:
    external: false