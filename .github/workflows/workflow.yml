name: DotNet CI

on: 
    push: 
        branches: 
            - develop
    pull_request: 
        branches:
            - develop
            - main

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4          
      - uses: actions/setup-dotnet@v4      
        with:
          dotnet-version: '10.0.x'
          cache: true
          cache-dependency-path: "**/packages.lock.json"

      - name: Build project in dev env
        run: dotnet build -o ${{ github.workspace }}/out/build

      - uses: actions/upload-artifact@v7
        with: 
            name: build_result
            path: ${{ github.workspace }}/out/build

  test:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: build_result
          path: ${{github.workspace}}/out/build
      - uses: actions/setup-dotnet@v4      
        with:
          dotnet-version: '10.0.x'
      - run: dotnet test ${{github.workspace}}/out/build/AuthenticationProviderTests.dll

  integration-test:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: build_result
          path: ${{github.workspace}}/out/build
      - uses: actions/setup-dotnet@v4      
        with:
          dotnet-version: '10.0.x'
      - run: dotnet test ${{github.workspace}}/out/build/AuthenticationProviderIntegrationTests.dll
