name: DotNet CI

on: 
    push: 
        branches: 
            - develop

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4          
      - uses: actions/setup-dotnet@v4      
        with:
          dotnet-version: '10.0.x'
          cache: true
          cache-dependency-path: "**/packages.lock.json"
      - run: dotnet build -o ${{ github.workspace }}/out
      - uses: actions/upload-artifact@v7
        with: 
            name: build_result
            path: ${{ github.workspace }}/out/

  test:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: build_result
          path: ${{github.workspace}}/out/
      - uses: actions/setup-dotnet@v4      
        with:
          dotnet-version: '10.0.x'
      - run: dotnet test ${{github.workspace}}/out/AuthenticationProviderTests.dll
