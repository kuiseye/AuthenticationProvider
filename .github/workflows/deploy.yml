name: Deploy application

on:
    push:
        branches: 
            main

jobs:
    deploy:
        runs-on: ubuntu-24.04
        steps:
            - name: Load repository
              uses: actions/checkout@v4
            - name: Configure keys
              run: > 
                mkdir .ssh && 
                printf ${KNOWN_HOSTS} > ~/.ssh/known_hosts &&
                printf ${SSH_KEY} > ~/.ssh/id_ed25519 &&
                chmod 600 ~/.ssh/id_ed25519 
            - name: Say hi!
              run: ssh ${USERNAME}@${HOST} './deploy ${DB_USER} ${DB_PASSWORD} ${SIGNING_KEY} ${VERIFICATION_KEY}'